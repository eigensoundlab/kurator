name: Desktop app

# Builds the desktop app (desktop/, Tauri) for Windows, macOS (one app for Apple silicon and Intel)
# and Linux, then starts each one against this checkout's Kurator (--selftest).
#   * every run: the installers as downloadable artifacts of the run (Actions → this run → Artifacts)
#   * a published GitHub release (tag vX.Y.Z): the installers are attached to it
# macOS is signed and notarized when the Apple secrets are set (docs/desktop.md), else signed ad hoc.

on:
  push:
    branches: [main]
    paths: ["desktop/**", "kurator/static/**", "kurator/__main__.py", "install.sh", "install.bat", "pyproject.toml",
            "tools/install_extras.py", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: "Attach the installers to this existing release (its tag, e.g. v0.19.0); empty: artifacts only"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    permissions:
      contents: write   # attaching the installers to a release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
            targets: ""
          - name: macos
            os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: linux
            os: ubuntu-24.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: The release is this version of the app
        if: github.event_name == 'release' || inputs.release != ''
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.release }}
        run: |
          v=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          t="${TAG#v}"; t="${t#.}"          # v0.19.0, 0.19.0 and v.0.19.0 all mean 0.19.0
          if [ "$t" != "$v" ]; then
            echo "::error::The release's tag is $TAG but the desktop app is $v (desktop/src-tauri/tauri.conf.json, Cargo.toml, package.json). Tag releases v$v."
            exit 1
          fi

      - name: The release to attach the installers to
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            echo "id=${{ github.event.release.id }}" >> "$GITHUB_OUTPUT"
          elif [ -n "$TAG" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id) || { echo "::error::No release with the tag $TAG"; exit 1; }
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb

      - name: Tauri CLI
        working-directory: desktop
        run: npm ci

      - name: macOS signing (when the secrets are set)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # only what is set goes on to the build: an empty variable would make Tauri try to use it
          put() { if [ -n "${!1}" ]; then { echo "$1<<KURATOR_EOF"; printf '%s\n' "${!1}"; echo "KURATOR_EOF"; } >> "$GITHUB_ENV"; fi; }
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Signing with the Developer ID certificate"
            put APPLE_CERTIFICATE; put APPLE_CERTIFICATE_PASSWORD; put APPLE_SIGNING_IDENTITY
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
              put APPLE_API_ISSUER; put APPLE_API_KEY
              echo "Notarizing with the App Store Connect API key"
            elif [ -n "$APPLE_ID" ]; then
              put APPLE_ID; put APPLE_PASSWORD; put APPLE_TEAM_ID
              echo "Notarizing with the Apple ID"
            else
              echo "::warning::Signed but not notarized: add APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8 (docs/desktop.md)"
            fi
          else
            echo "No certificate: the app is signed ad hoc (macOS asks once before the first start, see docs/desktop.md)"
            echo '{"bundle": {"macOS": {"signingIdentity": "-"}}}' > "$RUNNER_TEMP/adhoc.json"
            echo "EXTRA_ARGS=--config $RUNNER_TEMP/adhoc.json" >> "$GITHUB_ENV"
          fi

      - name: Build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }} ${{ env.EXTRA_ARGS }}
          releaseId: ${{ steps.rel.outputs.id }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "kurator-desktop-[platform]-[arch]-[bundle]"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Kurator for the self-test
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -q --upgrade pip
          "$PY" -m pip install -q -e ".[formats]"

      - name: Self-test (the app starts Kurator, shows its page, and the page can use the app)
        shell: bash
        timeout-minutes: 10
        env:
          KURATOR_HOME: ${{ github.workspace }}
          KURATOR_ARGS: --no-ai --no-scan --no-watch --data-dir ${{ runner.temp }}/kurator-data
          KURATOR_SELFTEST_OUT: ${{ runner.temp }}/selftest.txt
        run: |
          dir=desktop/src-tauri/target/release
          [ "$RUNNER_OS" = macOS ] && dir=desktop/src-tauri/target/universal-apple-darwin/release
          exe=""
          for name in Kurator Kurator.exe kurator-desktop kurator-desktop.exe; do
            [ -f "$dir/$name" ] && exe="$dir/$name" && break
          done
          [ -n "$exe" ] || { echo "::error::No app in $dir"; ls -la "$dir"; exit 1; }
          echo "Running $exe --selftest"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$exe" --selftest; else "$exe" --selftest; fi
          cat "$KURATOR_SELFTEST_OUT"

      - name: Install self-test (a computer without Kurator or Python - the app installs Kurator itself)
        shell: bash
        timeout-minutes: 25
        env:
          KURATOR_SELFTEST_INSTALL: "1"
          KURATOR_ARGS: --no-ai --no-scan --no-watch --data-dir ${{ runner.temp }}/kurator-data-2
          KURATOR_SELFTEST_OUT: ${{ runner.temp }}/selftest-install.txt
        run: |
          # this commit's code stands in for the release download; the app runs from outside the checkout,
          # so it finds no Kurator: it downloads its Python (checksum-pinned), installs Kurator and starts it
          T="$RUNNER_TEMP"
          [ "$RUNNER_OS" = Windows ] && T=$(cygpath -u "$RUNNER_TEMP")
          git archive --prefix=kurator-src/ -o "$T/kurator-src.tar.gz" HEAD
          export KURATOR_SOURCE="$T/kurator-src.tar.gz"
          [ "$RUNNER_OS" = Windows ] && export KURATOR_SOURCE=$(cygpath -w "$KURATOR_SOURCE")
          dir=desktop/src-tauri/target/release
          [ "$RUNNER_OS" = macOS ] && dir=desktop/src-tauri/target/universal-apple-darwin/release
          exe=""
          for name in Kurator Kurator.exe kurator-desktop kurator-desktop.exe; do
            [ -f "$dir/$name" ] && exe="$dir/$name" && break
          done
          mkdir -p "$T/fresh" && cp "$exe" "$T/fresh/"
          app="$T/fresh/$(basename "$exe")"
          echo "Running $app --selftest (installing)"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$app" --selftest; else "$app" --selftest; fi
          cat "$KURATOR_SELFTEST_OUT"

      - name: Self-test logs to the run summary
        if: failure()
        shell: bash
        run: |
          local_data=/nonexistent
          [ -n "$LOCALAPPDATA" ] && local_data=$(cygpath -u "$LOCALAPPDATA")
          {
            echo "### Desktop app: ${{ matrix.name }}"
            for f in "${{ runner.temp }}/selftest.txt" "${{ runner.temp }}/selftest-install.txt" \
                     $(find "$HOME/.local/share/com.eigensound.kurator" "$HOME/Library/Logs/com.eigensound.kurator" \
                            "$local_data/com.eigensound.kurator" -name '*.log' 2>/dev/null); do
              [ -f "$f" ] || continue
              echo; echo "**$(basename "$f")**"; echo '```'; tail -n 40 "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
