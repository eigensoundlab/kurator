name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catch newly published vulnerabilities in dependencies
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[dev,3d]"
      - name: Tests
        run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Failures to the run summary (one page for all jobs, ready to copy)
        if: failure()
        shell: bash
        run: python tools/ci_failures.py pytest-report.xml "test (${{ matrix.os }}, ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install newest dependencies (incl. the AI and 3D extras, CPU build of PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager ".[audit,ai,3d]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: pip-audit (known vulnerabilities)
        run: python tools/audit_deps.py --strict
