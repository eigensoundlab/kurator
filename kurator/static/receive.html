<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurator: sessions from Ballistic Foley Lab</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1' fill='%237aa2ff'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1' fill='%23557'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1' fill='%23557'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1' fill='%237aa2ff'/%3E%3C/svg%3E">
  <script type="module" src="/static/js/receive.js"></script>
</head>
<body class="receive">
  <main class="rcv">
    <h1>Kurator</h1>
    <p class="rcv-lead">Recording sessions from Ballistic Foley Lab on this computer</p>
    <p id="rcv-status" role="status" aria-live="polite">Starting…</p>
    <ul id="rcv-list" class="rcv-list" aria-label="Sessions received"></ul>
    <p id="rcv-where" class="muted"></p>
    <p class="muted">You can close this tab. Ballistic Foley Lab opens it again when you send the next session, and the takes are already in Kurator's library.</p>
  </main>
</body>
</html>
