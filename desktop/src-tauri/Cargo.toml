[package]
name = "kurator-desktop"
version = "0.19.0"
description = "Kurator desktop app: a window around the local Kurator server"
authors = ["sandner.art"]
license = "Apache-2.0"
repository = "https://github.com/eigensoundlab/kurator"
edition = "2021"

[[bin]]
name = "kurator-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["image-png", "devtools"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-drag = "2.1"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
