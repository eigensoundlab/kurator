<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kurator</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 16 16" aria-hidden="true">
      <rect x="1" y="1" width="6" height="6" rx="1" fill="#7aa2ff"/><rect x="9" y="1" width="6" height="6" rx="1" fill="#557"/>
      <rect x="1" y="9" width="6" height="6" rx="1" fill="#557"/><rect x="9" y="9" width="6" height="6" rx="1" fill="#7aa2ff"/>
    </svg>
    <h1>Kurator</h1>
    <p id="msg">Starting…</p>
    <p id="detail" class="detail"></p>
    <div class="bar" id="bar"><span></span></div>
    <div id="actions" class="actions" hidden>
      <button id="install" class="primary" type="button">Install Kurator</button>
      <button id="choose" type="button">Choose the Kurator folder…</button>
      <button id="retry" type="button">Try again</button>
      <button id="logs" type="button">Open the log folder</button>
      <button id="help" type="button">Help</button>
    </div>
  </main>
  <script src="splash.js"></script>
</body>
</html>
